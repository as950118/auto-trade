name: Manual DB Ops (migration diagnose/fix)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "diagnose (read-only SELECTs) or fix (marks trading.0024_kr_disclosure_earnings as applied, no DDL, then finishes deploy)"
        required: true
        type: choice
        options:
          - diagnose
          - fix
          - logs
        default: diagnose

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Diagnose (read-only)
        if: ${{ inputs.action == 'diagnose' }}
        run: |
          scp -i ~/.ssh/deploy_key ops/diagnose.py "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/diagnose.py"
          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "sudo cp /tmp/diagnose.py /opt/auto-trade/_ops_diagnose.py && sudo chown www-data:www-data /opt/auto-trade/_ops_diagnose.py && cd /opt/auto-trade && sudo -u www-data env HOME=/opt/auto-trade .venv/bin/python _ops_diagnose.py; sudo rm -f /opt/auto-trade/_ops_diagnose.py /tmp/diagnose.py"
          echo "=== showmigrations trading (tail) ==="
          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "cd /opt/auto-trade && sudo -u www-data env HOME=/opt/auto-trade .venv/bin/python manage.py showmigrations trading | tail -15"

      - name: Fix (fake-apply 0024, then finish deploy)
        if: ${{ inputs.action == 'fix' }}
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "cd /opt/auto-trade && sudo -u www-data env HOME=/opt/auto-trade .venv/bin/python manage.py migrate trading 0024_kr_disclosure_earnings --fake --noinput"
          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "cd /opt/auto-trade && sudo -u www-data env HOME=/opt/auto-trade .venv/bin/python manage.py migrate --noinput"
          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "cd /opt/auto-trade && sudo -u www-data env HOME=/opt/auto-trade .venv/bin/python manage.py collectstatic --noinput"
          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "sudo systemctl restart autotrade && sleep 3 && sudo systemctl --no-pager --full status autotrade"
          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "curl -fsS http://127.0.0.1:8000/api/health/"

      - name: Logs (read-only)
        if: ${{ inputs.action == 'logs' }}
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "curl -sS -i http://127.0.0.1:8000/api/health/ | head -30"
          echo "=== journalctl -u autotrade -n 60 ==="
          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "sudo journalctl -u autotrade -n 60 --no-pager"

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
